<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MonyGo V2</title><style>body{margin:0;background:#080f20;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:30px 16px 100px}.box{background:#151f38;border:1px solid #293754;border-radius:18px;padding:20px;margin:18px 0}button,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 18px;color:#fff;background:#7651ff;font-weight:bold}input,textarea{width:100%;box-sizing:border-box;margin:8px 0 15px;padding:13px;background:#0b1326;color:#fff;border:1px solid #2c3955;border-radius:12px}.login{max-width:420px;margin:12vh auto}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#111a30;padding:14px;border-radius:15px}.video{width:100%;max-height:430px;background:#000;border-radius:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.msg{text-align:center;color:#b9a8ff;min-height:24px}.post{background:#111a30;border:1px solid #293754;border-radius:16px;padding:15px;margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#080f20;border-top:1px solid #273452;padding:10px;display:flex;gap:8px}.bottom button{flex:1}</style></head><body>
<section id="login" class="wrap login"><div class="box"><h1 style="text-align:center">🟣 MonyGo</h1><p style="text-align:center">Create • Share • Earn</p><input id="user" placeholder="Email or Username"><input id="pass" type="password" placeholder="Password"><button id="loginBtn" style="width:100%">Login</button><button id="regBtn" style="width:100%;margin-top:8px;background:#25314c">Create Account</button><p id="authMsg" class="msg"></p></div></section>
<div id="app" class="hidden"><header class="top box" style="margin:0;border-radius:0"><b>🟣 MonyGo</b><button id="profile">MG</button></header><main class="wrap"><section><h1>Turn your content into rewards.</h1><p>Create, share and collect MonyPoints.</p></section><section class="stats"><div class="stat">Balance<br><b id="balance">0</b></div><div class="stat">Videos<br><b id="count">0</b></div><div class="stat">Likes<br><b id="likes">0</b></div></section>
<section class="box" id="studio"><h2>🎥 Video Studio</h2><input id="title" maxlength="80" placeholder="Video title"><textarea id="desc" maxlength="500" placeholder="Description"></textarea><input id="file" type="file" accept="video/*"><video id="preview" class="video" controls playsinline></video><div class="actions"><button id="camera">📹 Start Camera</button><button id="stop" style="background:#25314c" disabled>⏹ Stop</button></div><button id="download" style="width:100%;margin-top:8px;background:#25314c;display:none">⬇️ Download</button><button id="publish" style="width:100%;margin-top:8px">🚀 Publish Video +10</button><p id="videoMsg" class="msg"></p></section>
<section class="box" id="feed"><h2>🔥 Latest Videos</h2><div id="list"></div></section></main><nav class="bottom"><button onclick="document.getElementById('feed').scrollIntoView()">🏠 Home</button><button onclick="document.getElementById('studio').scrollIntoView()">🎥 Create</button><button onclick="alert('MonyPoints: '+state.balance+'\nReal withdrawals are not enabled yet.')">🪙 Wallet</button></nav></div>
<script>
let state=JSON.parse(localStorage.getItem('monygo-state')||'{"balance":0,"likes":0,"videos":[]}');let url='';let stream=null;let rec=null;let chunks=[];const $=id=>document.getElementById(id);function save(){localStorage.setItem('monygo-state',JSON.stringify(state))}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function open(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('profile').textContent=(localStorage.getItem('monygo-user')||'MG').slice(0,2).toUpperCase();render()}function render(){$('balance').textContent=state.balance;$('count').textContent=state.videos.length;$('likes').textContent=state.likes;$('list').innerHTML=state.videos.length?state.videos.slice().reverse().map(v=>`<article class="post"><h3>🎬 ${esc(v.title)}</h3><p>${esc(v.desc||'No description')}</p>${v.url?`<video class="video" src="${v.url}" controls playsinline></video>`:''}<small>👤 ${esc(v.user)}</small><div class="actions" style="margin-top:8px"><button onclick="like(${v.id})">❤️ ${v.likes}</button><button style="background:#25314c" onclick="view(${v.id})">👁️ ${v.views}</button></div></article>`).join(''):'<div class="post" style="text-align:center">🎬 No videos yet.<br>Create your first video!</div>'}function like(id){let v=state.videos.find(x=>x.id===id);if(v){v.likes++;state.likes++;save();render()}}function view(id){let v=state.videos.find(x=>x.id===id);if(v){v.views++;save();render()}}
$('loginBtn').onclick=()=>{let u=$('user').value.trim(),p=$('pass').value.trim();if(!u||!p){$('authMsg').textContent='Please enter username and password.';return}if(p.length<4){$('authMsg').textContent='Password must be at least 4 characters.';return}localStorage.setItem('monygo-user',u);open()};$('regBtn').onclick=()=>{$('loginBtn').click()};$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;if(!f.type.startsWith('video/')){$('videoMsg').textContent='Please select a video file.';return}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);$('preview').src=url;$('videoMsg').textContent='✅ Video loaded successfully.'};$('camera').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('preview').srcObject=stream;$('preview').muted=true;await $('preview').play();chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let b=new Blob(chunks,{type:'video/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('preview').srcObject=null;$('preview').src=url;$('preview').muted=false;$('download').style.display='block';$('download').onclick=()=>{let a=document.createElement('a');a.href=url;a.download='monygo-video.webm';a.click()};$('videoMsg').textContent='✅ Recording finished!'};rec.start();$('camera').disabled=true;$('stop').disabled=false;$('videoMsg').textContent='🔴 Recording...'}catch(e){$('videoMsg').textContent='❌ Camera permission denied or unavailable.'}};$('stop').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop();if(stream)stream.getTracks().forEach(t=>t.stop());$('camera').disabled=false;$('stop').disabled=true};$('publish').onclick=()=>{let t=$('title').value.trim();if(!t){$('videoMsg').textContent='Please enter a video title.';return}if(!url){$('videoMsg').textContent='Please upload or record a video.';return}state.videos.push({id:Date.now(),title:t,desc:$('desc').value.trim(),user:localStorage.getItem('monygo-user')||'User',likes:0,views:0,url});state.balance+=10;save();render();$('title').value='';$('desc').value='';$('videoMsg').textContent='🎉 Video published! +10 MonyPoints'};$('profile').onclick=()=>alert('User: '+(localStorage.getItem('monygo-user')||'User')+'\nVideos: '+state.videos.length+'\nMonyPoints: '+state.balance);if(localStorage.getItem('monygo-user'))open();
</script></body></html>
