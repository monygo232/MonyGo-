<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f20">
<title>MonyGo — Create, Share & Earn</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080f20;
  color:#fff;
}
button,input,textarea{font:inherit}
button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  color:white;
}
.top{
  padding:16px 20px;
  border-bottom:1px solid #26324e;
  background:#0b1326;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7048ff,#ad7cff);
  font-size:20px;
  font-weight:bold;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:bold;
}
main{
  max-width:720px;
  margin:auto;
  padding:28px 16px 100px;
}
.hero{text-align:center;padding:25px 0 30px}
.hero h1{
  font-size:45px;
  line-height:1.05;
  margin:10px 0 15px;
}
.hero p{color:#aeb8cc}
.primary{
  background:linear-gradient(135deg,#7048ff,#a679ff);
}
.secondary{background:#25314c}
.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:25px;
}
.stat{
  background:#121c33;
  border:1px solid #293754;
  border-radius:15px;
  padding:14px 8px;
  text-align:center;
}
.stat span{
  display:block;
  color:#9da9be;
  font-size:13px;
}
.stat strong{font-size:25px}
.card{
  background:#151f38;
  border:1px solid #293754;
  border-radius:17px;
  padding:20px;
  margin-bottom:25px;
}
.card h2{margin-top:0}
label{
  display:block;
  margin:14px 0;
  font-weight:bold;
}
input,textarea{
  width:100%;
  margin-top:7px;
  padding:13px;
  border-radius:12px;
  border:1px solid #2c3955;
  background:#0b1326;
  color:white;
  outline:none;
}
textarea{min-height:110px;resize:vertical}
.full{width:100%}

.video-box{
  width:100%;
  background:#050912;
  border-radius:15px;
  overflow:hidden;
  margin:15px 0;
}
video{
  width:100%;
  display:block;
  max-height:430px;
  background:#000;
}
.video-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.message{
  text-align:center;
  color:#b9a7ff;
  min-height:24px;
}
.post{
  background:#111a30;
  border:1px solid #293754;
  border-radius:15px;
  padding:17px;
  margin-top:12px;
}
.post h3{margin:0 0 8px}
.post p{color:#b9c2d3}
.post small{color:#8591a8}
.empty{
  text-align:center;
  color:#8995ab;
  padding:25px;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#080f20;
  border-top:1px solid #26324e;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:9px 12px;
}
.bottom button{background:#202c47}
.bottom .active{background:#7651ff}

#app{display:none}

.login-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.login-box{
  width:100%;
  max-width:420px;
  background:#111a30;
  border:1px solid #293754;
  border-radius:20px;
  padding:25px;
}
.login-logo{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7048ff,#a679ff);
  font-size:30px;
  font-weight:bold;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin:25px 0 15px;
  background:#0a1224;
  border-radius:12px;
  padding:4px;
}
.tabs button{background:transparent}
.tabs .selected{background:#7651ff}
.logout{
  background:#242f49;
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen" class="login-screen">
  <div class="login-box">

    <div class="login-logo">M</div>

    <h2 style="text-align:center">MonyGo</h2>
    <p style="text-align:center;color:#98a5bb">
      Create • Share • Earn
    </p>

    <div class="tabs">
      <button id="loginTab" class="selected">Login</button>
      <button id="registerTab">Register</button>
    </div>

    <input id="username" placeholder="Email or Username">
    <input id="password" type="password" placeholder="Password">

    <button id="authBtn" class="primary full" style="margin-top:15px">
      Login
    </button>

    <p id="authMessage" class="message"></p>

  </div>
</section>


<!-- APP -->
<div id="app">

<header class="top">
  <div class="brand">
    <span class="logo">M</span>
    <span>MonyGo</span>
  </div>

  <button id="logoutBtn" class="logout">Logout</button>
</header>


<main>

<section class="hero">
  <p>CREATE • SHARE • EARN</p>

  <h1>Turn your content into rewards.</h1>

  <p>
    Upload videos, record from your camera,
    share your content and earn MonyPoints.
  </p>

  <div class="actions">
    <button class="primary" onclick="scrollToId('videoStudio')">
      🎥 Video Studio
    </button>

    <button class="secondary" onclick="scrollToId('feed')">
      Explore
    </button>
  </div>
</section>


<!-- STATS -->
<section class="stats">

  <div class="stat">
    <span>Balance</span>
    <strong id="balance">0</strong>
    <span>Points</span>
  </div>

  <div class="stat">
    <span>Videos</span>
    <strong id="videoCount">0</strong>
  </div>

  <div class="stat">
    <span>Likes</span>
    <strong id="likeCount">0</strong>
  </div>

</section>


<!-- VIDEO STUDIO -->
<section id="videoStudio" class="card">

  <h2>🎥 Video Studio</h2>

  <p style="color:#9da9be">
    Upload a video or record one using your camera.
  </p>

  <label>
    Video Title
    <input id="videoTitle" maxlength="80"
      placeholder="Enter video title">
  </label>

  <label>
    Description
    <textarea id="videoDescription" maxlength="500"
      placeholder="Write something about your video"></textarea>
  </label>

  <label>
    Choose Video
    <input id="videoFile" type="file" accept="video/*">
  </label>

  <div class="video-box">
    <video id="videoPreview" controls playsinline></video>
  </div>

  <div class="video-buttons">

    <button id="cameraBtn" class="primary">
      📹 Start Camera
    </button>

    <button id="stopBtn" class="secondary" disabled>
      ⏹ Stop
    </button>

  </div>

  <button id="downloadBtn" class="secondary full"
    style="margin-top:10px;display:none">
    ⬇️ Download Video
  </button>

  <button id="publishVideoBtn" class="primary full"
    style="margin-top:10px">
    🚀 Publish Video
  </button>

  <p id="videoMessage" class="message"></p>

</section>


<!-- POSTS -->
<section id="feed">

  <div class="card">

    <h2>🔥 Latest Videos</h2>

    <div id="videoList"></div>

  </div>

</section>

</main>


<nav class="bottom">

  <button class="active"
    onclick="scrollToId('feed')">
    🏠 Home
  </button>

  <button
    onclick="scrollToId('videoStudio')">
    🎥 Create
  </button>

  <button
    onclick="showWallet()">
    🪙 Wallet
  </button>

</nav>

</div>


<script>

let isLoginMode = true;

let currentVideoURL = "";

let mediaStream = null;

let recorder = null;

let recordedChunks = [];

let state = JSON.parse(
  localStorage.getItem("monygo-state") ||
  '{"balance":0,"videos":[],"likes":0}'
);


/* AUTH */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const loginTab =
  document.getElementById("loginTab");

const registerTab =
  document.getElementById("registerTab");

const authBtn =
  document.getElementById("authBtn");

const authMessage =
  document.getElementById("authMessage");


loginTab.onclick = () => {

  isLoginMode = true;

  loginTab.classList.add("selected");
  registerTab.classList.remove("selected");

  authBtn.textContent = "Login";

};


registerTab.onclick = () => {

  isLoginMode = false;

  registerTab.classList.add("selected");
  loginTab.classList.remove("selected");

  authBtn.textContent = "Register";

};


authBtn.onclick = () => {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if(!username || !password){

    authMessage.textContent =
      "Please enter username and password.";

    return;
  }

  if(password.length < 4){

    authMessage.textContent =
      "Password must be at least 4 characters.";

    return;
  }

  if(isLoginMode){

    localStorage.setItem(
      "monygo-user",
      username
    );

    openApp();

  }else{

    localStorage.setItem(
      "monygo-user",
      username
    );

    authMessage.textContent =
      "Account created successfully!";
